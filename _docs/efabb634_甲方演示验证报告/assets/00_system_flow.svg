<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">多无人机协同区域搜索系统流程</title>
  <desc id="desc">自然语言任务经过LLM任务理解与工具编排、确定性覆盖规划器和UAV Server执行，最终进入2D与3D态势展示及Checker验收；异常信息由UAV Server反馈给LLM用于恢复决策。LLM不直接控制底层飞行。</desc>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0D7C75"/>
    </linearGradient>
    <linearGradient id="llmFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF7FF"/>
      <stop offset="100%" stop-color="#F8FBFE"/>
    </linearGradient>
    <linearGradient id="serverFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECF9F6"/>
      <stop offset="100%" stop-color="#F8FCFB"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16324F" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324F" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2F6F9F"/>
    </marker>
    <marker id="arrowTeal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#18857D"/>
    </marker>
    <style>
      .zh { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #16324F; letter-spacing: 1px; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #60758A; letter-spacing: .4px; }
      .step { font-size: 14px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .card-title { font-size: 21px; font-weight: 700; fill: #16324F; }
      .card-title-small { font-size: 19px; font-weight: 700; fill: #16324F; }
      .card-body { font-size: 15px; font-weight: 400; fill: #496174; }
      .edge-label { font-size: 13px; font-weight: 600; fill: #45697F; }
      .feedback-label { font-size: 14px; font-weight: 600; fill: #14766F; }
      .boundary-title { font-size: 16px; font-weight: 700; fill: #0F5F5A; }
      .boundary-body { font-size: 16px; font-weight: 500; fill: #294C59; }
    </style>
  </defs>

  <!-- White report-ready background -->
  <rect width="1600" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="12" fill="url(#headerGradient)"/>

  <!-- Heading -->
  <text class="zh title" x="800" y="66" text-anchor="middle">多无人机协同区域搜索系统流程</text>
  <text class="zh subtitle" x="800" y="98" text-anchor="middle">从自然语言任务到确定性规划、飞行执行与可视化验收</text>
  <line x1="570" y1="122" x2="1030" y2="122" stroke="#D7E5EE" stroke-width="2"/>

  <!-- Stage labels -->
  <g filter="url(#softShadow)">
    <rect x="128" y="149" width="94" height="30" rx="15" fill="#477FA8"/>
    <rect x="426" y="149" width="94" height="30" rx="15" fill="#3679A8"/>
    <rect x="738" y="149" width="94" height="30" rx="15" fill="#2A8094"/>
    <rect x="1053" y="149" width="94" height="30" rx="15" fill="#18857D"/>
    <rect x="1373" y="149" width="94" height="30" rx="15" fill="#287C8B"/>
  </g>
  <text class="zh step" x="175" y="170" text-anchor="middle">01 任务输入</text>
  <text class="zh step" x="473" y="170" text-anchor="middle">02 智能编排</text>
  <text class="zh step" x="785" y="170" text-anchor="middle">03 路径规划</text>
  <text class="zh step" x="1100" y="170" text-anchor="middle">04 飞行执行</text>
  <text class="zh step" x="1420" y="170" text-anchor="middle">05 展示验收</text>

  <!-- Main cards -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="200" width="270" height="254" rx="18" fill="#F7FAFC" stroke="#B9D1E1" stroke-width="2"/>
    <rect x="345" y="200" width="255" height="254" rx="18" fill="url(#llmFill)" stroke="#6FA5CC" stroke-width="2"/>
    <rect x="635" y="200" width="300" height="254" rx="18" fill="#F3F9FC" stroke="#76AFC1" stroke-width="2"/>
    <rect x="970" y="200" width="260" height="254" rx="18" fill="url(#serverFill)" stroke="#4CA89D" stroke-width="2"/>
    <rect x="1265" y="200" width="310" height="254" rx="18" fill="#F1F9F8" stroke="#61A6A3" stroke-width="2"/>
  </g>

  <!-- Accent bars -->
  <path d="M58 200 H292 Q310 200 310 218 V226 H40 V218 Q40 200 58 200 Z" fill="#477FA8"/>
  <path d="M363 200 H582 Q600 200 600 218 V226 H345 V218 Q345 200 363 200 Z" fill="#3679A8"/>
  <path d="M653 200 H917 Q935 200 935 218 V226 H635 V218 Q635 200 653 200 Z" fill="#2A8094"/>
  <path d="M988 200 H1212 Q1230 200 1230 218 V226 H970 V218 Q970 200 988 200 Z" fill="#18857D"/>
  <path d="M1283 200 H1557 Q1575 200 1575 218 V226 H1265 V218 Q1265 200 1283 200 Z" fill="#287C8B"/>

  <!-- Card 1: task -->
  <circle cx="175" cy="267" r="25" fill="#E1EEF6" stroke="#7DA8C4" stroke-width="1.5"/>
  <path d="M163 267 h24 M175 255 v24" stroke="#326E97" stroke-width="3" stroke-linecap="round"/>
  <text class="zh card-title" x="175" y="315" text-anchor="middle">自然语言任务</text>
  <line x1="74" y1="332" x2="276" y2="332" stroke="#DCE8EF"/>
  <circle cx="74" cy="355" r="3" fill="#477FA8"/>
  <circle cx="74" cy="384" r="3" fill="#477FA8"/>
  <circle cx="74" cy="413" r="3" fill="#477FA8"/>
  <text class="zh card-body" x="86" y="361">区域搜索目标</text>
  <text class="zh card-body" x="86" y="390">3 架无人机协同</text>
  <text class="zh card-body" x="86" y="419">高度、覆盖率、拍照等约束</text>

  <!-- Card 2: LLM -->
  <circle cx="472.5" cy="267" r="25" fill="#DCEEFF" stroke="#6FA5CC" stroke-width="1.5"/>
  <circle cx="465" cy="263" r="3.5" fill="#3679A8"/>
  <circle cx="481" cy="263" r="3.5" fill="#3679A8"/>
  <path d="M463 276 Q472.5 283 482 276" fill="none" stroke="#3679A8" stroke-width="2.5" stroke-linecap="round"/>
  <text class="zh card-title-small" x="472.5" y="310" text-anchor="middle">LLM 任务理解与工具编排</text>
  <line x1="369" y1="332" x2="576" y2="332" stroke="#D4E5F2"/>
  <circle cx="370" cy="355" r="3" fill="#3679A8"/>
  <circle cx="370" cy="384" r="3" fill="#3679A8"/>
  <circle cx="370" cy="413" r="3" fill="#3679A8"/>
  <text class="zh card-body" x="382" y="361">解析任务目标与约束</text>
  <text class="zh card-body" x="382" y="390">选择工具并组织调用顺序</text>
  <text class="zh card-body" x="382" y="419">依据拒绝原因作恢复决策</text>

  <!-- Card 3: deterministic planner -->
  <circle cx="785" cy="267" r="25" fill="#DEF1F5" stroke="#76AFC1" stroke-width="1.5"/>
  <path d="M771 278 L778 269 L786 273 L798 255" fill="none" stroke="#267B90" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="771" cy="278" r="3" fill="#267B90"/>
  <circle cx="778" cy="269" r="3" fill="#267B90"/>
  <circle cx="786" cy="273" r="3" fill="#267B90"/>
  <circle cx="798" cy="255" r="3" fill="#267B90"/>
  <text class="zh card-title" x="785" y="315" text-anchor="middle">确定性覆盖规划器</text>
  <line x1="667" y1="332" x2="903" y2="332" stroke="#D6E8ED"/>
  <circle cx="669" cy="355" r="3" fill="#2A8094"/>
  <circle cx="669" cy="384" r="3" fill="#2A8094"/>
  <circle cx="669" cy="413" r="3" fill="#2A8094"/>
  <text class="zh card-body" x="681" y="361">区域分区与扫描线生成</text>
  <text class="zh card-body" x="681" y="390">输出可复现的航点路径</text>
  <text class="zh card-body" x="681" y="419">提供规划，不承担飞控执行</text>

  <!-- Card 4: UAV Server -->
  <circle cx="1100" cy="267" r="25" fill="#DDF4EF" stroke="#4CA89D" stroke-width="1.5"/>
  <path d="M1085 269 L1096 265 L1100 253 L1104 265 L1115 269 L1104 273 L1100 283 L1096 273 Z" fill="none" stroke="#18857D" stroke-width="2.3" stroke-linejoin="round"/>
  <text class="zh card-title" x="1100" y="315" text-anchor="middle">UAV Server</text>
  <line x1="995" y1="332" x2="1205" y2="332" stroke="#D3E9E5"/>
  <circle cx="995" cy="355" r="3" fill="#18857D"/>
  <circle cx="995" cy="384" r="3" fill="#18857D"/>
  <circle cx="995" cy="413" r="3" fill="#18857D"/>
  <text class="zh card-body" x="1007" y="361">执行飞行指令</text>
  <text class="zh card-body" x="1007" y="390">碰撞 / 障碍校验</text>
  <text class="zh card-body" x="1007" y="419">记录位置、轨迹与照片</text>

  <!-- Card 5: viewer and checker -->
  <circle cx="1420" cy="267" r="25" fill="#DEF1F0" stroke="#61A6A3" stroke-width="1.5"/>
  <rect x="1406" y="257" width="28" height="18" rx="3" fill="none" stroke="#287C8B" stroke-width="2.3"/>
  <path d="M1414 282 h12 M1420 275 v7" stroke="#287C8B" stroke-width="2.3" stroke-linecap="round"/>
  <text class="zh card-title-small" x="1420" y="310" text-anchor="middle">2D / 3D 态势与 Checker</text>
  <line x1="1295" y1="332" x2="1545" y2="332" stroke="#D4E8E7"/>
  <circle cx="1296" cy="355" r="3" fill="#287C8B"/>
  <circle cx="1296" cy="384" r="3" fill="#287C8B"/>
  <circle cx="1296" cy="413" r="3" fill="#287C8B"/>
  <text class="zh card-body" x="1308" y="361">Viewer：准实时态势展示</text>
  <text class="zh card-body" x="1308" y="390">Roam：任务后轨迹复盘</text>
  <text class="zh card-body" x="1308" y="419">Checker：覆盖率与拍照验收</text>

  <!-- Primary flow arrows -->
  <path d="M310 327 H336" fill="none" stroke="#2F6F9F" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M600 327 H626" fill="none" stroke="#2F6F9F" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M935 327 H961" fill="none" stroke="#18857D" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M1230 327 H1256" fill="none" stroke="#18857D" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <rect x="591" y="285" width="44" height="22" rx="11" fill="#FFFFFF" stroke="#D4E5F2"/>
  <text class="zh edge-label" x="613" y="301" text-anchor="middle">约束</text>
  <rect x="924" y="285" width="48" height="22" rx="11" fill="#FFFFFF" stroke="#D1E8E4"/>
  <text class="zh edge-label" x="948" y="301" text-anchor="middle">航点</text>
  <rect x="1212" y="285" width="65" height="22" rx="11" fill="#FFFFFF" stroke="#D1E8E4"/>
  <text class="zh edge-label" x="1244.5" y="301" text-anchor="middle">状态结果</text>

  <!-- Exception feedback loop -->
  <path d="M1100 454 V506 Q1100 526 1080 526 H493 Q472.5 526 472.5 506 V463"
        fill="none" stroke="#18857D" stroke-width="2.5" stroke-dasharray="8 7"
        marker-end="url(#arrowTeal)"/>
  <rect x="676" y="509" width="220" height="34" rx="17" fill="#FFFFFF" stroke="#79BBB4" stroke-width="1.5"/>
  <text class="zh feedback-label" x="786" y="531" text-anchor="middle">拒绝原因 / 异常状态反馈</text>
  <text class="zh edge-label" x="1122" y="493">恢复后重新编排</text>

  <!-- Responsibility boundary -->
  <g filter="url(#softShadow)">
    <rect x="240" y="584" width="1120" height="84" rx="18" fill="#F2FAF8" stroke="#79BEB5" stroke-width="1.8"/>
  </g>
  <circle cx="290" cy="626" r="23" fill="#D9F0EC"/>
  <path d="M281 625 l7 7 l13 -15" fill="none" stroke="#15776F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="zh boundary-title" x="329" y="617">职责边界</text>
  <text class="zh boundary-body" x="329" y="645">LLM 负责任务理解、工具编排与异常恢复决策；底层飞行由 UAV Server 按确定性路径执行，LLM 不直接控制飞控。</text>
</svg>
